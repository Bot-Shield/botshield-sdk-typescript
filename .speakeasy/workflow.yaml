workflowVersion: 1.0.0
# Pinned to the generator that produced the published release. `latest` + the daily
# cron opened a drift PR (2.0.1, agentKeyAuth3/4 noise) the day after 2.0.0 shipped.
# Bump deliberately, regenerate, review the diff, then release.
speakeasyVersion: 1.796.3
sources:
    botshield-oas:
        inputs:
            - location: registry.speakeasyapi.dev/botshield/sdk/botshield-oas
        overlays:
            - location: ./.speakeasy/overlays/botshield-surface.yaml
        registry:
            location: registry.speakeasyapi.dev/botshield/sdk/botshield-oas
targets:
    botshield-sdk-ts:
        target: typescript
        source: botshield-oas
        publish:
            npm:
                token: $NPM_TOKEN
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/botshield/sdk/botshield-oas-typescript-code-samples
            labelOverride:
                fixedValue: Typescript (SDK)
            blocking: false
