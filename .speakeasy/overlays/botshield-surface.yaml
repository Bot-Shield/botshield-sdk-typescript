overlay: 1.0.0
info:
  title: BotShield SDK surface + MCP gating
  version: 1.0.0
# Ports the intent of botshield-wg/stainless.yaml onto the OpenAPI spec as
# x-speakeasy-* extensions. Two jobs:
#   1. Preserve the partner-facing surface (RFC 42 A4): resource groups + method
#      names identical to what Stainless produced (client.sdk.*, .verification.*,
#      .actions.proposeAction / .checkActionStatus / .cancelAction).
#   2. MCP as an AFFIRMATIVE ALLOWLIST (RFC 42 A2): only the three actions.* Queue
#      verbs become discrete MCP tools; every V2 sdk.*/verification.* op is
#      x-speakeasy-mcp.disabled. This is the per-op selection Stainless deprecated
#      (Code Mode gave only a whole-SDK sandbox + blocklist) — now honored per tool.
#   Selection mirrors stainless.yaml: actions resource mcp:true, sdk + verification mcp:false.
actions:
  # ────────────────────────────────────────────────────────────────────────────
  # MCP security fix — Speakeasy's MCP generator does NOT support per-operation
  # security ("per-operation security is not supported in MCP server generation").
  # The spec has no global security and puts AgentKeyAuth per-op on the 3 actions
  # ops (the MCP-exposed ones), so every tool was skipped. Fix WITHOUT changing
  # behavior: set global security = AgentKeyAuth and remove it from the actions ops
  # (they now INHERIT the same AgentKeyAuth globally). sdk.*/verification.* keep
  # their per-op ApiKeyAuth (they override global, and being MCP-disabled they
  # don't reach the MCP generator). Net: identical auth per method; both keys still
  # in the SDK (A4); MCP generator satisfied.
  # NOTE (RFC 42): this touches the auth surface — flag for Dev's eye on co-sign.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $
    update:
      security:
        - AgentKeyAuth: []
  - target: $.paths["/agentlink/inquire"].post.security
    remove: true
  - target: $.paths["/agentlink/check-status"].get.security
    remove: true
  - target: $.paths["/agentlink/cancel"].post.security
    remove: true
  # ────────────────────────────────────────────────────────────────────────────
  # actions / Agents Ask — the ONLY MCP-exposed resource (3 discrete tools)
  # ────────────────────────────────────────────────────────────────────────────
  # RFC 42 A3 (Dev counter, Paul ✅): agent-facing MCP tool verb = RESOLUTION, not
  # action ("Action card" deprecated in K.1 → Queue card; Proof of Resolution +
  # Resolution states are the live canon). Option A: rename the exposed MCP TOOL
  # names only (x-speakeasy-mcp.name); the SDK actions.* resource + method names
  # (x-speakeasy-name-override) stay, trued up to resolution on the next version.
  - target: $.paths["/agentlink/inquire"].post
    update:
      x-speakeasy-group: actions
      x-speakeasy-name-override: proposeAction
      x-speakeasy-mcp:
        name: propose_resolution
        description: >-
          Propose a human-presence-gated action to a BotShield user (Agents Ask).
          Returns a card_id immediately; the signed Proof of Resolution arrives
          async via the agent's registered callback, or poll check_resolution_status.
        scopes: [queue]
  - target: $.paths["/agentlink/check-status"].get
    update:
      x-speakeasy-group: actions
      x-speakeasy-name-override: checkActionStatus
      x-speakeasy-mcp:
        name: check_resolution_status
        description: >-
          Poll a proposed resolution (pass wait_seconds up to 25 to long-poll).
          Terminal states (approved/denied) carry the signed Proof of Resolution
          JWT — verify against BotShield's JWKS; the request_id is the JWT jti.
        scopes: [queue]
  - target: $.paths["/agentlink/cancel"].post
    update:
      x-speakeasy-group: actions
      x-speakeasy-name-override: cancelAction
      x-speakeasy-mcp:
        name: cancel_resolution
        description: >-
          Stand down a queued resolution before the user responds. No-op once
          terminal; TTL expiry produces no Resolution.
        scopes: [queue]
  # ────────────────────────────────────────────────────────────────────────────
  # census.* (was sdk.*) — Census partner ops, EXCLUDED from MCP. Group renamed: a group literally
  # named `sdk` is written to src/sdk/sdk.ts and clobbers the ROOT client class (no `BotShield`
  # export existed in any Speakeasy build) — and Census is the K.1 name for these ops anyway.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/sdk/create-session"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: createSession, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/create-verification-link"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: createVerificationLink, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/verify-token"].post
    # security added: original spec left this unset → with global now AgentKeyAuth,
    # pin ApiKeyAuth so it doesn't inherit the agent key (matches Stainless default).
    # (Note: verify-token is actually public — the JWT signature is the proof — a
    # place the spec's auth modeling is loose; flagged for cleanup, not blocking.)
    update: { x-speakeasy-group: census, x-speakeasy-name-override: verifyToken, x-speakeasy-mcp: { disabled: true }, security: [ { ApiKeyAuth: [] } ] }
  - target: $.paths["/sdk/store-signal"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: storeSignal, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/validate-signal"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: validateSignal, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/partner-config"].get
    update: { x-speakeasy-group: census, x-speakeasy-name-override: getPartnerConfig, x-speakeasy-mcp: { disabled: true }, security: [ { ApiKeyAuth: [] } ] }
  - target: $.paths["/sdk/revoke-verification"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: revokeVerification, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/logout"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: logout, x-speakeasy-mcp: { disabled: true } }
  # ────────────────────────────────────────────────────────────────────────────
  # verification.* — SDK-only, EXCLUDED from MCP (mirrors verification mcp:false)
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/verification/status"].get
    update: { x-speakeasy-group: verification, x-speakeasy-name-override: getStatus, x-speakeasy-mcp: { disabled: true }, security: [ { ApiKeyAuth: [] } ] }

  # ────────────────────────────────────────────────────────────────────────────
  # user_email — DEPRECATED (Stage 2b item 5, ❓18 zero-retention)
  #
  # Marked deprecated, NOT removed. It is a published input on three partner-
  # facing operations, so deleting it is a breaking change that needs a major
  # version. `deprecated: true` makes Speakeasy emit @deprecated on the generated
  # field, which is the signal partners actually see in their editor.
  #
  # It already does nothing on create-verification-link: the value is discarded
  # rather than stored (the write was severed), and verification_events.user_email
  # is 0 of 10,567 rows — never populated. So this documents reality rather than
  # announcing a future change.
  #
  # Removal is gated on: (a) a major SDK version, and (b) evidence no partner
  # still sends it — the operations log a warning when it is supplied, which is
  # how that evidence gets collected.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/sdk/create-verification-link"].post.requestBody.content["application/json"].schema.properties.user_email
    update:
      deprecated: true
      description: |-
        **Deprecated.** Ignored — the value is discarded and never stored. Identity does not
        reach BotShield: verification is keyed on an opaque identifier. Use `partner_user_ref`
        if you need to correlate the verification with your own user. Will be removed in the
        next major version.
  - target: $.paths["/sdk/revoke-verification"].post.requestBody.content["application/json"].schema.properties.user_email
    update:
      deprecated: true
      description: |-
        **Deprecated.** Use `partner_user_id` to identify whose verification to revoke.
        Will be removed in the next major version.
  - target: $.paths["/agentlink/inquire"].post.requestBody.content["application/json"].schema.properties.user_email
    update:
      deprecated: true
      description: |-
        **Deprecated.** Address the proposal with `opaque_id` (the pairwise id from the bind
        ceremony) instead. Will be removed in the next major version.
  # ────────────────────────────────────────────────────────────────────────────
  # Partner surface allowlist (3.3, 2026-10-13). The engine spec also carries
  # operations a partner cannot call with their own keys — the BotShield app's
  # (users/linkages/*, link/resolve|accept|decline), the CDN worker's (link/mint),
  # and Console-session ones (partner/linkages/*).
  # They never belong in the public SDK or its MCP server. sdk/partner-config stays: it shipped in 2.0.x (removing it would break callers) (docs repo scripts/build-openapi.mjs allowlist).
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/link/mint"]
    remove: true
  - target: $.paths["/link/resolve"]
    remove: true
  - target: $.paths["/link/accept"]
    remove: true
  - target: $.paths["/link/decline"]
    remove: true
  - target: $.paths["/partner/linkages/list"]
    remove: true
  - target: $.paths["/partner/linkages/revoke"]
    remove: true
  - target: $.paths["/users/linkages/list"]
    remove: true
  - target: $.paths["/users/linkages/revoke"]
    remove: true
  # ────────────────────────────────────────────────────────────────────────────
  # Secured Accounts — partner-server API (SDK 2.2, 2026-10-13). API-key auth (per-op
  # ApiKeyAuth in the spec). client.securedAccounts.list / revoke / getStatus.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/secured-accounts/list"].get
    update: { x-speakeasy-group: securedAccounts, x-speakeasy-name-override: list, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/secured-accounts/revoke"].post
    update: { x-speakeasy-group: securedAccounts, x-speakeasy-name-override: revoke, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/secured-accounts/status"].get
    update: { x-speakeasy-group: securedAccounts, x-speakeasy-name-override: getStatus, x-speakeasy-mcp: { disabled: true } }

  # ────────────────────────────────────────────────────────────────────────────
  # gates.* — Gates API (3.4): a company's server places and runs its own gates and
  # BotShield Actions with a bs_ key granted `gates:write` (per-op GatesKeyAuth in the
  # spec). EXCLUDED from MCP. client.gates.create / activate / close / cancel / get /
  # list · client.gates.actions.create / list / setState
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/gates-api/create"].post
    update: { x-speakeasy-group: gates, x-speakeasy-name-override: create, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/activate"].post
    update: { x-speakeasy-group: gates, x-speakeasy-name-override: activate, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/close"].post
    update: { x-speakeasy-group: gates, x-speakeasy-name-override: close, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/cancel"].post
    update: { x-speakeasy-group: gates, x-speakeasy-name-override: cancel, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/get"].get
    update: { x-speakeasy-group: gates, x-speakeasy-name-override: get, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/list"].get
    update: { x-speakeasy-group: gates, x-speakeasy-name-override: list, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/actions/create"].post
    update: { x-speakeasy-group: gates.actions, x-speakeasy-name-override: create, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/actions/list"].get
    update: { x-speakeasy-group: gates.actions, x-speakeasy-name-override: list, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/actions/set-state"].post
    update: { x-speakeasy-group: gates.actions, x-speakeasy-name-override: setState, x-speakeasy-mcp: { disabled: true } }
  # 4.0 J6: rename an action, or mark it staff can send. client.gates.actions.update
  - target: $.paths["/gates-api/actions/update"].post
    update: { x-speakeasy-group: gates.actions, x-speakeasy-name-override: update, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/extend"].post
    update: { x-speakeasy-group: gates, x-speakeasy-name-override: extend, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/actions/request"].post
    update: { x-speakeasy-group: gates.actions, x-speakeasy-name-override: request, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/gates-api/actions/request-status"].get
    update: { x-speakeasy-group: gates.actions, x-speakeasy-name-override: requestStatus, x-speakeasy-mcp: { disabled: true } }
  # 4.0 Loop 186 G7: a company withdraws an action request it sent. client.gates.actions.requestCancel
  - target: $.paths["/gates-api/actions/request-cancel"].post
    update: { x-speakeasy-group: gates.actions, x-speakeasy-name-override: requestCancel, x-speakeasy-mcp: { disabled: true } }

  # ────────────────────────────────────────────────────────────────────────────
  # inlinePasskey.* — the partner inline passkey lane (SDK 2.3). PUBLIC: the request_id
  # is the credential, so `security: []` in the spec overrides the global AgentKeyAuth
  # above. EXCLUDED from MCP (a browser/app ceremony, not an agent tool).
  # client.inlinePasskey.getOptions / .complete
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/request/passkey-options"].post
    update: { x-speakeasy-group: inlinePasskey, x-speakeasy-name-override: getOptions, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/request/passkey-complete"].post
    update: { x-speakeasy-group: inlinePasskey, x-speakeasy-name-override: complete, x-speakeasy-mcp: { disabled: true } }

  # ────────────────────────────────────────────────────────────────────────────
  # 4.0 (SDK 4.0.0) — new partner-server operations. EXCLUDED from MCP.
  # The engine spec puts these two on a `bearerAuth` scheme it never defines (the spec
  # would not validate). They take the company's SECRET key (`Bearer bs_…`), which is
  # ApiKeyAuth here, as for create-session / revoke-verification.
  # client.census.sendByNumber / client.census.confirmLink
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/sdk/send-by-number"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: sendByNumber, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/send-by-number"].post.security
    remove: true
  - target: $.paths["/sdk/send-by-number"].post
    update: { security: [ { ApiKeyAuth: [] } ] }
  - target: $.paths["/sdk/confirm-link"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: confirmLink, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/confirm-link"].post.security
    remove: true
  - target: $.paths["/sdk/confirm-link"].post
    update: { security: [ { ApiKeyAuth: [] } ] }
  # Loop 186 G4: check a Proof of Resolution once. Takes the agent's own key OR the company's
  # secret key, so both are offered (the engine spec left it unset = the global agent key only).
  # Not an MCP tool: the MCP allowlist stays the three Queue verbs (RFC 42 A2).
  # client.actions.verifyResolution
  - target: $.paths["/sdk/verify-resolution"].post
    update: { x-speakeasy-group: actions, x-speakeasy-name-override: verifyResolution, x-speakeasy-mcp: { disabled: true }, security: [ { AgentKeyAuth: [] }, { ApiKeyAuth: [] } ] }

  # ────────────────────────────────────────────────────────────────────────────
  # 4.0 fields the engine returns that its spec does not yet describe. Without them the
  # generated parsers drop the values. Remove each entry once the engine spec carries it.
  # ────────────────────────────────────────────────────────────────────────────
  # verify-resolution: a refused key arrives as data.error (code `invalid_key`).
  - target: $.paths["/sdk/verify-resolution"].post.responses["200"].content["application/json"].schema.properties.data.properties
    update:
      error: { $ref: "#/components/schemas/GatesApiError" }
  # VH-31: each action says whether it is high-value (list / create / update).
  - target: $.components.schemas.BotShieldAction.properties
    update:
      high_value:
        type: boolean
        description: "4.0: high-value. It starts only from your customer's signed-in session (your server naming the account by your own reference); by phone number or by staff it is refused (`action_requires_signed_in`). Set with `highValue` on create or update."
  # B-34 / PG-4: limits carry how long to wait.
  - target: $.components.schemas.ErrorBody.properties
    update:
      retry_after_seconds:
        type: integer
        description: "On a 429 limit (`too_many_open_requests`, `daily_request_limit`, `send_rate_limited`, `unanswered_limit_reached`): seconds until a retry can succeed."
  - target: $.components.schemas.GatesApiError.properties
    update:
      retry_after_seconds:
        type: integer
        description: "On a 429 limit: seconds until a retry can succeed."
  # D3 "pending until your server confirms": verify-token reports where the link stands, and
  # confirms it when called with the secret key and `partner_user_ref`.
  - target: $.paths["/sdk/verify-token"].post.responses["200"].content["application/json"].schema.properties.data.properties.data.properties
    update:
      link:
        type: object
        description: "4.0: present only on a token whose link waited for your server. `pending`: not confirmed (send your secret key and `partner_user_ref`, or call sdk/confirm-link). `live` with `confirmed: true`: this check confirmed it. `not_live`: the confirm was refused (`code`)."
        properties:
          state: { type: string, enum: [pending, live, not_live] }
          confirmed: { type: boolean }
          handle: { type: string }
          first_time: { type: boolean }
          code: { type: string, description: "`link_pending`, or the confirm refusal code (as sdk/confirm-link)." }
          message: { type: string }
  - target: $.paths["/sdk/verify-token"].post.responses["200"].content["application/json"].schema.properties.data.properties.data.properties.claims.properties
    update:
      link_state:
        type: string
        description: "4.0: where the link stood for this token: `pending`, `live`, `expired` or `refused`. Absent on a plain check."
  - target: $.paths["/verification/status"].get.responses["200"].content["application/json"].schema.properties.data.properties
    update:
      link_state:
        type: ["string", "null"]
        enum: [pending, live, expired, refused, null]
        description: "4.0: where the link stands on this request. Null on a plain check and on a link from before 4.0. A pass whose link is not live carries no destination."
      link_expires_at:
        type: ["string", "null"]
        format: date-time
        description: "4.0: when a pending link expires (24 hours after the tap). Null unless `link_state` is `pending`."
      link_code:
        type: string
        description: "4.0: `link_pending` while the link waits for your server."
      link_message:
        type: string

  # ────────────────────────────────────────────────────────────────────────────
  # 4.0 model names (`title` names the generated type; it does not rename the field). Pinned so the generator's collision rules neither rename a published
  # export (`Link`, the gate's link policy, would otherwise become VerificationGetStatusLink
  # once verify-token gained `link`) nor mint bare names like `Detail` / `DataSent`.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/verification/status"].get.responses["200"].content["application/json"].schema.properties.data.properties.gate.properties.link
    update: { title: Link }
  - target: $.paths["/sdk/verify-token"].post.responses["200"].content["application/json"].schema.properties.data.properties.data.properties.link
    update: { title: SdkVerifyTokenLink }
  - target: $.paths["/sdk/send-by-number"].post.responses["200"].content["application/json"].schema.properties.data.properties.data
    update: { title: SdkSendByNumberDataData }
  - target: $.paths["/sdk/confirm-link"].post.responses["200"].content["application/json"].schema.properties.data.properties.data
    update: { title: SdkConfirmLinkDataData }
  - target: $.paths["/sdk/verify-resolution"].post.responses["200"].content["application/json"].schema.properties.data.properties.data
    update: { title: SdkVerifyResolutionDataData }
  - target: $.paths["/gates-api/actions/request"].post.requestBody.content["application/json"].schema.properties.details.items
    update: { title: GatesApiActionsRequestDetail }

  # ────────────────────────────────────────────────────────────────────────────
  # 4.0 (SDK 4.0.1) — Recover Account with BotShield (document 24) and Sign in with your
  # passkey (document 25): the company SERVER's calls, secret key (per-op ApiKeyAuth in the
  # engine spec). EXCLUDED from MCP (not agent tools).
  # client.recovery.exchange / .otherRoute · client.signIn.request / .confirm
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/recovery/exchange"].post
    update: { x-speakeasy-group: recovery, x-speakeasy-name-override: exchange, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/recovery/other-route"].post
    update: { x-speakeasy-group: recovery, x-speakeasy-name-override: otherRoute, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/signin/request"].post
    update: { x-speakeasy-group: signIn, x-speakeasy-name-override: request, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/signin/confirm"].post
    update: { x-speakeasy-group: signIn, x-speakeasy-name-override: confirm, x-speakeasy-mcp: { disabled: true } }
  # 4.0.1 model names: without these the new enums come out as bare `Kind` (beside the
  # published operations `Kind`, the token kind), `Act` and `FinishedBy`.
  - target: $.components.schemas.BotShieldAction.properties.kind
    update: { title: BotShieldActionKind }
  - target: $.paths["/recovery/exchange"].post.responses["200"].content["application/json"].schema.properties.data.properties.data.properties.act
    update: { title: RecoveryExchangeAct }
  - target: $.paths["/signin/confirm"].post.responses["200"].content["application/json"].schema.properties.data.properties.data.properties.finished_by
    update: { title: SigninConfirmFinishedBy }
