overlay: 1.0.0
info:
  title: BotShield SDK surface + MCP gating
  version: 1.0.0
# Ports the intent of botshield-wg/stainless.yaml onto the OpenAPI spec as
# x-speakeasy-* extensions. Two jobs:
#   1. Preserve the partner-facing surface (RFC 42 A4): resource groups + method
#      names identical to what Stainless produced (client.sdk.*, .verification.*,
#      .actions.proposeAction / .checkActionStatus / .cancelAction).
#   2. MCP as an AFFIRMATIVE ALLOWLIST (RFC 42 A2): only the three actions.* Queue
#      verbs become discrete MCP tools; every V2 sdk.*/verification.* op is
#      x-speakeasy-mcp.disabled. This is the per-op selection Stainless deprecated
#      (Code Mode gave only a whole-SDK sandbox + blocklist) — now honored per tool.
#   Selection mirrors stainless.yaml: actions resource mcp:true, sdk + verification mcp:false.
actions:
  # ────────────────────────────────────────────────────────────────────────────
  # MCP security fix — Speakeasy's MCP generator does NOT support per-operation
  # security ("per-operation security is not supported in MCP server generation").
  # The spec has no global security and puts AgentKeyAuth per-op on the 3 actions
  # ops (the MCP-exposed ones), so every tool was skipped. Fix WITHOUT changing
  # behavior: set global security = AgentKeyAuth and remove it from the actions ops
  # (they now INHERIT the same AgentKeyAuth globally). sdk.*/verification.* keep
  # their per-op ApiKeyAuth (they override global, and being MCP-disabled they
  # don't reach the MCP generator). Net: identical auth per method; both keys still
  # in the SDK (A4); MCP generator satisfied.
  # NOTE (RFC 42): this touches the auth surface — flag for Dev's eye on co-sign.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $
    update:
      security:
        - AgentKeyAuth: []
  - target: $.paths["/agentlink/inquire"].post.security
    remove: true
  - target: $.paths["/agentlink/check-status"].get.security
    remove: true
  - target: $.paths["/agentlink/cancel"].post.security
    remove: true
  # ────────────────────────────────────────────────────────────────────────────
  # actions / Agents Ask — the ONLY MCP-exposed resource (3 discrete tools)
  # ────────────────────────────────────────────────────────────────────────────
  # RFC 42 A3 (Dev counter, Paul ✅): agent-facing MCP tool verb = RESOLUTION, not
  # action ("Action card" deprecated in K.1 → Queue card; Proof of Resolution +
  # Resolution states are the live canon). Option A: rename the exposed MCP TOOL
  # names only (x-speakeasy-mcp.name); the SDK actions.* resource + method names
  # (x-speakeasy-name-override) stay, trued up to resolution on the next version.
  - target: $.paths["/agentlink/inquire"].post
    update:
      x-speakeasy-group: actions
      x-speakeasy-name-override: proposeAction
      x-speakeasy-mcp:
        name: propose_resolution
        description: >-
          Propose a human-presence-gated action to a BotShield user (Agents Ask).
          Returns a card_id immediately; the signed Proof of Resolution arrives
          async via the agent's registered callback, or poll check_resolution_status.
        scopes: [queue]
  - target: $.paths["/agentlink/check-status"].get
    update:
      x-speakeasy-group: actions
      x-speakeasy-name-override: checkActionStatus
      x-speakeasy-mcp:
        name: check_resolution_status
        description: >-
          Poll a proposed resolution (pass wait_seconds up to 25 to long-poll).
          Terminal states (approved/denied) carry the signed Proof of Resolution
          JWT — verify against BotShield's JWKS; the request_id is the JWT jti.
        scopes: [queue]
  - target: $.paths["/agentlink/cancel"].post
    update:
      x-speakeasy-group: actions
      x-speakeasy-name-override: cancelAction
      x-speakeasy-mcp:
        name: cancel_resolution
        description: >-
          Stand down a queued resolution before the user responds. No-op once
          terminal; TTL expiry produces no Resolution.
        scopes: [queue]
  # ────────────────────────────────────────────────────────────────────────────
  # census.* (was sdk.*) — Census partner ops, EXCLUDED from MCP. Group renamed: a group literally
  # named `sdk` is written to src/sdk/sdk.ts and clobbers the ROOT client class (no `BotShield`
  # export existed in any Speakeasy build) — and Census is the K.1 name for these ops anyway.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/sdk/create-session"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: createSession, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/create-verification-link"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: createVerificationLink, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/verify-token"].post
    # security added: original spec left this unset → with global now AgentKeyAuth,
    # pin ApiKeyAuth so it doesn't inherit the agent key (matches Stainless default).
    # (Note: verify-token is actually public — the JWT signature is the proof — a
    # place the spec's auth modeling is loose; flagged for cleanup, not blocking.)
    update: { x-speakeasy-group: census, x-speakeasy-name-override: verifyToken, x-speakeasy-mcp: { disabled: true }, security: [ { ApiKeyAuth: [] } ] }
  - target: $.paths["/sdk/store-signal"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: storeSignal, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/validate-signal"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: validateSignal, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/partner-config"].get
    update: { x-speakeasy-group: census, x-speakeasy-name-override: getPartnerConfig, x-speakeasy-mcp: { disabled: true }, security: [ { ApiKeyAuth: [] } ] }
  - target: $.paths["/sdk/revoke-verification"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: revokeVerification, x-speakeasy-mcp: { disabled: true } }
  - target: $.paths["/sdk/logout"].post
    update: { x-speakeasy-group: census, x-speakeasy-name-override: logout, x-speakeasy-mcp: { disabled: true } }
  # ────────────────────────────────────────────────────────────────────────────
  # verification.* — SDK-only, EXCLUDED from MCP (mirrors verification mcp:false)
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/verification/status"].get
    update: { x-speakeasy-group: verification, x-speakeasy-name-override: getStatus, x-speakeasy-mcp: { disabled: true }, security: [ { ApiKeyAuth: [] } ] }

  # ────────────────────────────────────────────────────────────────────────────
  # user_email — DEPRECATED (Stage 2b item 5, ❓18 zero-retention)
  #
  # Marked deprecated, NOT removed. It is a published input on three partner-
  # facing operations, so deleting it is a breaking change that needs a major
  # version. `deprecated: true` makes Speakeasy emit @deprecated on the generated
  # field, which is the signal partners actually see in their editor.
  #
  # It already does nothing on create-verification-link: the value is discarded
  # rather than stored (the write was severed), and verification_events.user_email
  # is 0 of 10,567 rows — never populated. So this documents reality rather than
  # announcing a future change.
  #
  # Removal is gated on: (a) a major SDK version, and (b) evidence no partner
  # still sends it — the operations log a warning when it is supplied, which is
  # how that evidence gets collected.
  # ────────────────────────────────────────────────────────────────────────────
  - target: $.paths["/sdk/create-verification-link"].post.requestBody.content["application/json"].schema.properties.user_email
    update:
      deprecated: true
      description: |-
        **Deprecated.** Ignored — the value is discarded and never stored. Identity does not
        reach BotShield: verification is keyed on an opaque identifier. Use `partner_user_ref`
        if you need to correlate the verification with your own user. Will be removed in the
        next major version.
  - target: $.paths["/sdk/revoke-verification"].post.requestBody.content["application/json"].schema.properties.user_email
    update:
      deprecated: true
      description: |-
        **Deprecated.** Use `partner_user_id` to identify whose verification to revoke.
        Will be removed in the next major version.
  - target: $.paths["/agentlink/inquire"].post.requestBody.content["application/json"].schema.properties.user_email
    update:
      deprecated: true
      description: |-
        **Deprecated.** Address the proposal with `opaque_id` (the pairwise id from the bind
        ceremony) instead. Will be removed in the next major version.
